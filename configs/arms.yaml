# Optimizer arms = rule assignment per block (see mog/optim/blockwise.py for rule definitions).
# Keys resolve by priority: block name > kind > attn/mlp > hidden > matrix > default.
# LR family decides the tuning grid (lr_grids below). One tuned scalar (lr) per arm.
arms:
  # --- homogeneous classic optimizers (every parameter, incl. 1-D gains) ---
  sgd:        {family: sgd,  rules: {default: sgd}}
  adamw:      {family: adam, rules: {default: adam}}
  lion:       {family: lion, rules: {default: lion}}
  adam_mini:  {family: adam, rules: {default: adam_mini}}
  # --- single geometry on every 2-D block (1-D gains -> adam) ---
  signum:     {family: adam, rules: {matrix: sign, default: adam}}        # elementwise corner
  normsgd:    {family: adam, rules: {matrix: euclid, default: adam}}      # Euclidean corner
  rownorm:    {family: adam, rules: {matrix: rows, default: adam}}        # per-neuron / per-token corner
  muon_all:   {family: adam, rules: {matrix: spectral, default: adam}}    # spectral everywhere
  # --- hybrids from practice and literature ---
  muon:       {family: adam, rules: {hidden: spectral, default: adam}}    # folklore: Muon hidden, AdamW rest
  normuon:    {family: adam, rules: {hidden: normuon, default: adam}}     # NorMuon (arXiv:2510.05491) hidden
  headmuon:   {family: adam, rules: {attn: spectral_head, mlp: spectral, default: adam}}  # per-head grouping (PDF §3.2, H4)
  pw05:       {family: adam, rules: {hidden: pw05, default: adam}}        # partial whitening alpha=1/2 (PDF §3.1)
  duality:    {family: adam, rules: {hidden: spectral, embed: rows, pos: rows, head: rows, default: adam}}  # PDF §2.2 per-token vocab rows (H5-style)
  randpart:   {family: adam, rules: {attn: spectral_randgroup, mlp: spectral, default: adam}}  # H4 control: random groups, head-sized
  scion:      {family: adam, rules: {hidden: spectral, embed: rows, pos: rows, head: sign, default: adam}}  # Scion Rec. 3.1 (ColNorm in, Sign out)

  # --- pivot Phase 0: shape vs scale on hidden weights (rest adam); all LMO-type rules at RMS 0.2 ---
  adam_rms:   {family: adam, rules: {hidden: adam_rms, default: adam}}        # Adam shape, Muon per-block scale
  spec_adamscale: {family: adam, rules: {hidden: spec_adamscale, default: adam}}  # Muon shape, Adam-like per-block scale
  polar:      {family: adam, rules: {hidden: polar_svd, default: adam}}       # exact UV^T (no Newton-Schulz error)
  randspec:   {family: adam, rules: {hidden: randspec, default: adam}}        # U diag(Uniform(0,1)) V^T, fresh each step
  kaon:       {family: adam, rules: {hidden: kaon, default: adam}}            # Kaon chaotic spectrum (arXiv:2605.11181)
  freon23:    {family: adam, rules: {hidden: freon23, default: adam}}         # S^(-1/3) (Schatten quasi-norm, c=2/3)
  freon34:    {family: adam, rules: {hidden: freon34, default: adam}}         # S^(-1/2) (c=3/4)
  sign_h:     {family: adam, rules: {hidden: sign, default: adam}}            # sign on hidden only
  rows_h:     {family: adam, rules: {hidden: rows, default: adam}}            # row-norm on hidden only

  # --- pivot Phase 2: SSL 2x2 {encoder, projector} x {adam, spectral} (proposal H6) ---
  ssl_enc_muon:  {family: adam, rules: {conv: spectral, fc: spectral, default: adam}}   # trunk hidden spectral, projector adam
  ssl_proj_muon: {family: adam, rules: {proj: spectral, default: adam}}                 # projector hidden spectral, trunk adam

lr_grids:   # Stage-2 (tiny) grids: 5 points per family, x~3.16 spacing
  adam: [0.001, 0.003, 0.01, 0.03, 0.1]
  lion: [0.0001, 0.0003, 0.001, 0.003, 0.01]
  sgd:  [0.03, 0.1, 0.3, 1.0, 3.0]
