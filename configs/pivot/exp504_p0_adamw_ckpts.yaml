experiment_id: exp504_p0_adamw_ckpts
entry: experiments/01_geometry_validation/atlas.py
evidence_class: measured
description: AdamW incumbent (tuned lr 0.01, seed 4, same as exp400) writing checkpoints
  100/300/500 for the Phase 0 unit oracle (self-confirming-geometry check). atlas_every
  is set beyond the run length, so no atlas measurements are taken.
seed: 4
arms:
  adamw:
    default: adam
lr:
  adamw: 0.01
atlas_every: 100000
checkpoints:
- 100
- 300
- 500
train:
  model:
    d: 128
    n_layer: 4
    n_head: 4
    ctx: 128
  batch_size: 16
  steps: 600
  warmup: 60
  min_lr_frac: 0.1
  eval_every: 100
  eval_batches: 8
  threads: 4
  seed: 4
