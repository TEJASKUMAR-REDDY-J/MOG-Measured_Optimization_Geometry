experiment_id: exp431_h4_randpart
entry: experiments/sweep.py
evidence_class: measured
description: H4 control at its tuned LR, seeds 1-3; compared pairwise with exp160
  headmuon and muon.
seed: 1
arms_file: configs/arms.yaml
arms:
- randpart
lr:
  randpart:
  - 0.01
seeds:
- 1
- 2
- 3
