experiment_id: exp011_tiny_atlas_dryrun
entry: experiments/01_geometry_validation/atlas.py
evidence_class: pilot   # Stage 2: validates the atlas pipeline; not evidence for H1/H2
description: Atlas instrumentation dry run on the ~0.11M model (Muon hybrid incumbent + AdamW).
seed: 0
arms:
  muon: {hidden: spectral, default: adam}
  adamw: {default: adam}
lr: {muon: 0.01, adamw: 0.01}
atlas_every: 25
checkpoints: [100, 200]
train:
  model: {d: 64, n_layer: 2, n_head: 2, ctx: 64}
  batch_size: 16
  steps: 300
  warmup: 30
  min_lr_frac: 0.1
  eval_every: 50
  eval_batches: 4
  seed: 0
  threads: 4
