[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mog"
version = "0.0.1"
description = "Measured Optimization Geometry: per-block selection of optimizer geometry from measured descent efficiency"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["mog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
