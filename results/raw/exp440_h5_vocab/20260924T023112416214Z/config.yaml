experiment_id: exp440_h5_vocab
entry: experiments/07_vocab_geometry/run.py
evidence_class: measured
description: 'H5: Adam (muon arm) vs per-token rows (duality arm) on embed/pos/head
  with GPT-2 BPE (~11.7k types). Tune on seed 0, evaluate seeds 1-3, loss by token-frequency
  decile.'
seed: 0
arms_file: configs/arms.yaml
arms:
- muon
- duality
lr_grid:
- 0.00333333
- 0.01
- 0.03
eval_seeds:
- 1
- 2
- 3
train:
  model:
    d: 128
    n_layer: 4
    n_head: 4
    ctx: 128
  batch_size: 16
  steps: 300
  warmup: 30
  min_lr_frac: 0.1
  eval_every: 50
  eval_batches: 16
  threads: 4
